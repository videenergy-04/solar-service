<h2>Register Service Complaint</h2>

<form id="complaintForm">

<input type="text" id="address" placeholder="Service Address" required><br><br>

<input type="text" id="capacity" placeholder="Plant Capacity (kW)" required><br><br>

<input type="text" id="inverter" placeholder="Inverter Brand"><br><br>

<textarea id="complaint" rows="5" placeholder="Describe your complaint" required></textarea><br><br>

<button class="btn" type="submit">Submit Complaint</button>

</form>
