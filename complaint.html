<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register Complaint</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>☀️ Solar Service Portal</h1>
  <p>Register Your Service Complaint</p>
</header>

<nav>
  <a href="index.html">Home</a>
  <a href="complaint.html">Register Complaint</a>
  <a href="track.html">Track Complaint</a>
  <a href="contact.html">Contact Us</a>
</nav>

<div class="hero">

  <h2>Complaint Registration</h2>

  <form id="complaintForm">

    <input
      type="text"
      id="name"
      placeholder="Customer Name"
      required
    ><br><br>

    <input
      type="tel"
      id="mobile"
      placeholder="Mobile Number"
      required
    ><br><br>

    <input
      type="text"
      id="address"
      placeholder="Address"
      required
    ><br><br>

    <input
      type="text"
      id="capacity"
      placeholder="Plant Capacity (kW)"
      required
    ><br><br>

    <textarea
      id="complaint"
      rows="5"
      placeholder="Complaint Details"
      required
    ></textarea><br><br>

    <button type="submit" class="btn">
      Submit Complaint
    </button>

  </form>

  <br>

  <p id="message"></p>

</div>

<footer>
  <p>&copy; 2026 Solar Service Portal. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
